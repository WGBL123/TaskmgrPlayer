# 本文件必须使用 UTF-8 编码
# 颜色使用 BGR 格式

# 任务管理器主窗口。
# WindowTitle 可以留空：任务管理器的标题随系统语言变化（任务管理器 / Task Manager），
# 留空时只按窗口类查找，兼容性最好。
WindowTitle=""
WindowClassName="TaskManagerWindow"

# CPU 图表窗口类。
# 程序会枚举当前“可见”的所有该类窗口：单核视图只有 1 个，多核（逻辑处理器）
# 视图会有多个，视频会整体覆盖这些图表组成的区域。
# 如果需要匹配多个候选类名，用 | 分隔，例如：CvChartWindow|AnotherChartClass
# 留空则覆盖整个任务管理器窗口（旧版行为）。
ChildClassName="CvChartWindow"

DrawGrid=true
ColorEdge=187, 125, 12
ColorDark=250, 246, 241
ColorBright=255, 255, 255
ColorGrid=244, 234, 217
ColorFrame=187, 125, 12
